<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Dynamic physics and astronomy learning website with simulations, cosmic questions, and science sources."
  />
  <title>Cosmic Physics Lab</title>
  <link rel="stylesheet" href="site-styles.css" />
</head>
<body data-page="home">
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">Cosmic Physics Lab</a>
      <nav id="mainNav" class="main-nav" aria-label="Main navigation"></nav>
    </div>
  </header>

  <main class="container page-shell">
    <section class="page-intro">
      <p id="verifiedLine" class="verified-line"></p>
      <h1 id="pageTitle"></h1>
      <p id="pageIntro" class="page-copy"></p>
      <div id="statusNote" class="status-note"></div>
    </section>

    <section id="homeLinks" class="page-links" hidden></section>

    <section class="curiosity-panel" aria-labelledby="curiosityTitle">
      <div>
        <p class="panel-kicker">Today’s curiosity</p>
        <h2 id="curiosityTitle">What would you like to investigate?</h2>
        <p id="curiosityQuestion">Loading a physics question...</p>
      </div>
      <a class="hub-action primary" href="search.html">Search the lab</a>
    </section>

    <section id="contentWrap" class="content-wrap">
      <div id="mainColumn" class="main-column">
        <div class="section-head">
          <h2 id="mainHeading"></h2>
        </div>
        <div id="cards" class="card-stack"></div>
      </div>

      <aside id="sideColumn" class="side-column">
        <div class="section-head">
          <h2 id="sourceHeading"></h2>
        </div>
        <div id="sourceGrid" class="source-stack"></div>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>Dynamic physics and astronomy learning site powered by <code>site-data.js</code>.</p>
      <p><a href="simulations.html">Explore simulations</a> · <a href="contact.html">Contact creator</a></p>
    </div>
  </footer>

  <script src="site-data.js"></script>
  <script src="site-app.js"></script>
  <script src="home-extras.js"></script>
  <script src="progress.js"></script>
  <script src="accessibility.js"></script>
  <script src="offline.js"></script>
</body>
</html>
